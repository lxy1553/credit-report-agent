[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-report-agent"
version = "0.1.0"
description = "Evidence-checked credit metric daily report generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.32,<1",
    "PyJWT[crypto]>=2.10,<3",
]
documents = [
    "python-docx==1.2.0",
    "reportlab==4.4.9",
]
all = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.32,<1",
    "PyJWT[crypto]>=2.10,<3",
    "python-docx==1.2.0",
    "reportlab==4.4.9",
]

[project.scripts]
report-agent = "report_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["report_agent*"]
